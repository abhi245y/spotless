name: Compatibility table

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: compat-readme

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'compat-report') || github.event_name == 'issues' && github.event.label.name == 'compat-report'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { table, update } = require('./.github/scripts/compat.js');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, labels: 'compat-report', state: 'all', per_page: 100,
            });
            const readme = fs.readFileSync('README.md', 'utf8');
            fs.writeFileSync('README.md', update(readme, table(issues, `${context.repo.owner}/${context.repo.repo}`)));
      - run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: update community compatibility table"
          git pull --rebase
          git push

  versions:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { versions } = require('./.github/scripts/compat.js');
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const path = '.github/ISSUE_TEMPLATE/compat_report.yml';
            fs.writeFileSync(path, versions(fs.readFileSync(path, 'utf8'), releases));
      - run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update release versions in compatibility form"
          git pull --rebase
          git push
